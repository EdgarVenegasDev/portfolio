name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build