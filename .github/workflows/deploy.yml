name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy production to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_SSH_PORT }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            docker pull ghcr.io/edgarvenegasdev/portfolio:latest

            echo "Stopping current container..."
            docker stop portfolio || true

            echo "Removing current container..."
            docker rm portfolio || true

            echo "Starting new container..."
            docker run -d \
              --name portfolio \
              --restart unless-stopped \
              --env-file ~/portfolio.env \
              -p 127.0.0.1:3000:3000 \
              ghcr.io/edgarvenegasdev/portfolio:latest

            echo "Waiting for application..."
            sleep 5

            echo "Checking application..."
            curl --fail --silent --show-error \
              http://127.0.0.1:3000 \
              > /dev/null

            echo "Checking API..."
            curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/projects \
              > /dev/null

            echo "Deployment successful!"

            docker ps --filter name=portfolio
